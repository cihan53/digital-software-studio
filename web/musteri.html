<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Müşteri Odası — Digital Software Studio</title>
<link rel="stylesheet" href="/web/stil.css">
<style>
  .duzen { display: flex; gap: 18px; height: calc(100vh - 57px); }
  .sohbet { flex: 1; display: flex; flex-direction: column; background: var(--panel);
    border: 1px solid var(--sinir); border-radius: var(--r); overflow: hidden; }
  .mesajlar { flex: 1; overflow-y: auto; padding: 18px; }
  .mesaj { max-width: 78%; margin-bottom: 12px; padding: 10px 14px; border-radius: 12px; white-space: pre-wrap; }
  .m-musteri { margin-left: auto; background: #1f3a5f; border-bottom-right-radius: 4px; }
  .m-asistan { background: var(--panel2); border: 1px solid var(--sinir); border-bottom-left-radius: 4px; }
  .m-sistem { background: transparent; color: var(--soluk); font-size: 12px; margin: 4px auto; text-align: center; max-width: 90%; }
  .taslak { margin-top: 8px; padding: 10px; border: 1px solid var(--vurgu); border-radius: 8px; background: rgba(88,166,255,.07); }
  .taslak .aks { margin-top: 8px; display: flex; gap: 8px; }
  .girdi { display: flex; gap: 10px; padding: 12px; border-top: 1px solid var(--sinir); }
  .girdi input { flex: 1; padding: 10px 14px; font-size: 14px; }
  .yan-panel { width: 320px; display: flex; flex-direction: column; gap: 12px; }
  .talep-kart { padding: 10px 12px; font-size: 13px; }
  .talep-kart .tid { font-weight: 700; }
  .yaziyor { color: var(--soluk); font-style: italic; padding: 4px 18px 10px; }
</style>
</head>
<body>
<div class="ust">
  <span class="logo">💬 Müşteri Odası</span>
  <span class="soluk">Talebini anlat, birlikte netleştirelim; onayladığında havuza alınır.</span>
  <span class="bosluk"></span>
  <button onclick="yeniOturum()">🗑 Yeni Oturum</button>
  <a href="/"><button>⌂</button></a>
</div>
<div class="icerik" style="max-width:1200px">
  <div class="duzen">
    <div class="sohbet">
      <div class="mesajlar" id="mesajlar"></div>
      <div class="yaziyor gizli" id="yaziyor">Temsilci yazıyor…</div>
      <div class="girdi">
        <input id="girdi" placeholder="Mesajınızı yazın… (örn: Harita sayfasında istasyonlar yüklenmiyor)" autocomplete="off">
        <button class="birincil" id="gonder" onclick="gonder()">Gönder</button>
      </div>
    </div>
    <div class="yan-panel">
      <div class="kart"><b>📥 Taleplerim</b><div id="talepler" style="margin-top:8px"></div></div>
      <div class="kart soluk" style="font-size:12px">
        Onaylanan talepler stüdyo havuzuna düşer; triage ve planlama otomatik yürütülür.
        Durum değişiklikleri burada görünür.
      </div>
    </div>
  </div>
</div>
<div id="toast" class="bildirim gizli"></div>
<script>
let oturum = localStorage.getItem('sohbet_oturum') || '';
let sonMesajSayisi = -1;
const $ = id => document.getElementById(id);
const esc = s => (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.remove('gizli');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.add('gizli'),5000);}

async function oturumGerek(){
  if(oturum) return oturum;
  const d = await (await fetch('/api/sohbet/yeni',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})).json();
  oturum = d.oturum_id; localStorage.setItem('sohbet_oturum', oturum);
  return oturum;
}
async function yeniOturum(){
  localStorage.removeItem('sohbet_oturum'); oturum=''; sonMesajSayisi=-1;
  $('mesajlar').innerHTML=''; await oturumGerek(); yukle(true);
  toast('Yeni sohbet oturumu açıldı.');
}

function mesajCiz(m){
  const d=document.createElement('div');
  if(m.gonderen==='sistem'){ d.className='mesaj m-sistem'; d.textContent=m.icerik; return d; }
  d.className='mesaj '+(m.gonderen==='musteri'?'m-musteri':'m-asistan');
  d.textContent=m.icerik;
  if(m.taslak){
    const t=m.taslak;
    const k=document.createElement('div'); k.className='taslak';
    k.innerHTML=`<b>📋 Taslak Talep</b><br>
      Tür: ${esc(t.tur)} · Öncelik: ${esc(t.oncelik)} · Sayfa: ${esc(t.sayfa_url||'/')}<br>
      <b>${esc(t.baslik)}</b><br><span class="soluk">${esc(t.aciklama||'')}</span>
      <div class="aks">
        <button class="birincil kucuk" onclick="onayla(${m.id})">✔ Onayla ve Gönder</button>
        <button class="kucuk" onclick="reddet(${m.id})">✕ İptal</button>
      </div>`;
    d.appendChild(k);
  }
  if(m.talep_id){
    const b=document.createElement('div');
    b.innerHTML=`<span class="rozet r-READY">${esc(m.talep_id)}</span>`;
    d.appendChild(b);
  }
  return d;
}

async function yukle(zorla){
  try{
    if(!oturum){ await oturumGerek(); }
    const d=await(await fetch('/api/sohbet?oturum='+oturum)).json();
    if(!d.ok)return;
    if(zorla||d.mesajlar.length!==sonMesajSayisi){
      sonMesajSayisi=d.mesajlar.length;
      const kutu=$('mesajlar'); kutu.innerHTML='';
      if(!d.mesajlar.length){
        kutu.innerHTML='<div class="mesaj m-sistem">Merhaba! 👋 Sorununuzu veya isteğinizi yazın; '+
          'birlikte netleştirip onayınıza sunalım.</div>';
      }
      for(const m of d.mesajlar) kutu.appendChild(mesajCiz(m));
      kutu.scrollTop=kutu.scrollHeight;
    }
    $('talepler').innerHTML=(d.talepler||[]).map(t=>
      `<div class="kart talep-kart" style="margin-bottom:8px">
        <span class="tid">${esc(t.id)}</span> <span class="rozet r-${t.durum}">${esc(t.durum||'')}</span><br>
        ${esc(t.baslik||'')}<br><span class="soluk">${esc(t.studio_notu||'')}</span></div>`
    ).join('')||'<span class="soluk">Henüz onaylanmış talep yok.</span>';
  }catch(e){}
}

async function gonder(){
  const inp=$('girdi'); const metin=inp.value.trim();
  if(!metin)return;
  inp.value=''; inp.disabled=true; $('gonder').disabled=true;
  $('yaziyor').classList.remove('gizli');
  // Optimistik ekleme
  const kutu=$('mesajlar');
  const ge=document.createElement('div'); ge.className='mesaj m-musteri'; ge.textContent=metin;
  kutu.appendChild(ge); kutu.scrollTop=kutu.scrollHeight;
  try{
    const d=await(await fetch('/api/sohbet/mesaj',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({oturum:oturum,icerik:metin})})).json();
    if(d.oturum_id&&!oturum){oturum=d.oturum_id;localStorage.setItem('sohbet_oturum',oturum);}
    if(!d.ok) toast(d.mesaj||'Gönderilemedi');
  }catch(e){ toast('Gönderilemedi: '+e); }
  $('yaziyor').classList.add('gizli');
  inp.disabled=false; $('gonder').disabled=false; inp.focus();
  sonMesajSayisi=-1; yukle(true);
}
async function onayla(mid){
  const d=await(await fetch('/api/sohbet/onay',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({oturum:oturum,mesaj_id:mid})})).json();
  toast(d.ok?`Talep havuza alındı: ${d.talep_id}`:(d.mesaj||'Onaylanamadı'));
  sonMesajSayisi=-1; yukle(true);
}
async function reddet(mid){
  const d=await(await fetch('/api/sohbet/red',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({oturum:oturum,mesaj_id:mid})})).json();
  toast(d.ok?'Taslak iptal edildi.':(d.mesaj||'İptal edilemedi'));
  sonMesajSayisi=-1; yukle(true);
}
document.getElementById('girdi').addEventListener('keydown',e=>{if(e.key==='Enter')gonder();});
yukle(true); setInterval(yukle,3000);
</script>
</body>
</html>
